name: Auto release on merge

# On every merge to master that touches the plugin, work out the next version
# from the merged PR's title (Conventional Commits), bump the version in source,
# tag it, build the vendored zips, publish a GitHub Release, and (once the
# wordpress.org SVN credentials are configured) deploy to wordpress.org.
#
# Two builds of the same version (bin/build-plugin-zip.sh):
#   * github — attached to the GitHub Release (the ONLY release asset, so the
#              GitHub self-updater on existing installs always picks it).
#   * org    — the wordpress.org build (no legacy/, no GitHub updater). Kept as
#              a workflow artifact and committed to wordpress.org SVN when the
#              WPORG_SVN_USERNAME / WPORG_SVN_PASSWORD secrets exist.
#
# Bump rules (highest wins):
#   * a breaking change  -> major   (PR title like "feat!: …", or "BREAKING CHANGE" in the body)
#   * "fix: …"           -> patch
#   * anything else       -> minor   (this is the default: an unprefixed or
#                                      feat/chore/docs/… title is treated as a feature)
#
# Manual minor/major or re-runs: use the workflow_dispatch "bump" input, or push
# a vX.Y.Z tag yourself (handled by release.yml).
on:
  push:
    branches:
      - master
    paths:
      - 'plugin/**'
      - '.github/workflows/auto-release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump level'
        default: 'auto'
        type: choice
        options: [auto, patch, minor, major]

# Need to push the bump commit + tag, and read the merged PR for its title.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  PLUGIN_SLUG: agent-connector-for-wp

jobs:
  release:
    runs-on: ubuntu-latest
    # Never react to our own "[skip ci]" version-bump commit (belt-and-braces:
    # GitHub also skips runs whose head commit message contains [skip ci]).
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed to compute the next version

      - name: Determine next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          [ -n "$latest" ] || latest="v0.0.0"
          echo "Latest tag: $latest"

          # Prefer the merged PR title; fall back to the head commit subject
          # (e.g. a direct push to master).
          title=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].title' 2>/dev/null || true)
          if [ -z "${title}" ] || [ "${title}" = "null" ]; then
            title=$(git log -1 --pretty=%s)
          fi
          body=$(git log -1 --pretty=%b)
          echo "Analyzing: $title"

          # Allow a manual override via workflow_dispatch.
          level="${{ github.event.inputs.bump || 'auto' }}"
          if [ "$level" = "auto" ]; then
            if printf '%s' "$title" | grep -qE '^[a-zA-Z]+(\(.+\))?!:' || printf '%s' "$body" | grep -qE 'BREAKING[ -]CHANGE'; then
              level="major"
            elif printf '%s' "$title" | grep -qiE '^fix(\(.+\))?:'; then
              level="patch"
            else
              # feat:, unprefixed, chore:, docs:, … all default to a feature bump.
              level="minor"
            fi
          fi
          echo "Bump: $level"

          ver=${latest#v}
          IFS='.' read -r MA MI PA <<< "$ver"
          case "$level" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
          esac
          new="${MA}.${MI}.${PA}"
          echo "New version: $new"
          {
            echo "version=$new"
            echo "tag=v$new"
          } >> "$GITHUB_OUTPUT"

      - name: Sync version into source
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          php="plugin/agent-connector-for-wp.php"
          sed -i -E "s/^( \* Version:[[:space:]]+).*/\1${V}/" "$php"
          sed -i -E "s/(define\( 'AGENT_CONNECTOR_FOR_WP_VERSION', ')[^']*(' \);)/\1${V}\2/" "$php"
          sed -i -E "s/^(Stable tag:[[:space:]]+).*/\1${V}/" plugin/readme.txt
          echo "---- changed lines ----"
          grep -nE "Version:|AGENT_CONNECTOR_FOR_WP_VERSION" "$php"
          grep -nE "Stable tag:" plugin/readme.txt

      - name: Commit, tag, and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/agent-connector-for-wp.php plugin/readme.txt
          git commit -m "chore(release): ${{ steps.ver.outputs.tag }} [skip ci]"

          # Push the bump commit, rebasing onto any concurrent push and retrying.
          # The sibling release workflow (default-abilities-release.yml) also
          # pushes a [skip ci] commit to this branch, so two releases triggered by
          # one merge can race here. Our change touches a different file than
          # theirs, so a rebase always applies cleanly and both releases land.
          n=0
          until git push origin "HEAD:${GITHUB_REF_NAME}"; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "::error::could not push the release commit after $n attempts"
              exit 1
            fi
            echo "Push rejected — rebasing onto ${GITHUB_REF_NAME} and retrying ($n)…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done

          # Tag the commit that actually landed (after any rebase), then push it.
          git tag -a "${{ steps.ver.outputs.tag }}" -m "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Build plugin zips
        run: |
          bin/build-plugin-zip.sh github
          bin/build-plugin-zip.sh org

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/github/${{ env.PLUGIN_SLUG }}.zip

      - name: Upload wordpress.org build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}-wordpress-org
          path: dist/org/${{ env.PLUGIN_SLUG }}.zip

      # Skipped until the wordpress.org listing exists and the
      # WPORG_SVN_USERNAME / WPORG_SVN_PASSWORD secrets are added.
      - name: Check for wordpress.org credentials
        id: wporg
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
        run: echo "enabled=$( [ -n "$SVN_USERNAME" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Install Subversion
        if: steps.wporg.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq subversion

      - name: Deploy to wordpress.org
        if: steps.wporg.outputs.enabled == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
          SLUG: ${{ env.PLUGIN_SLUG }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_DIR: dist/org/${{ env.PLUGIN_SLUG }}
