name: Build release zip

# Builds the distributable plugin zips with production Composer dependencies
# vendored in (plugin/vendor is gitignored, so the repo stays lean): the GitHub
# build (with the self-updater, attached to the release) and the wordpress.org
# build (without it, uploaded as a workflow artifact). Runs on
# version tags, and can be triggered manually for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_SLUG: agent-connector-for-wp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Build plugin zips (GitHub + wordpress.org)
        run: |
          bin/build-plugin-zip.sh github dist
          bin/build-plugin-zip.sh org dist

      - name: Upload GitHub build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}
          path: dist/github/${{ env.PLUGIN_SLUG }}.zip

      - name: Upload wordpress.org build
        uses: actions/upload-artifact@v4
        with:
          name: agent-connector-wordpress-org
          path: dist/org/agent-connector.zip

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/github/${{ env.PLUGIN_SLUG }}.zip
