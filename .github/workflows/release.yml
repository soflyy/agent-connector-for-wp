name: Build release zip

# Builds a distributable plugin zip with production Composer dependencies
# vendored in (plugin/vendor is gitignored, so the repo stays lean). Runs on
# version tags, and can be triggered manually for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_SLUG: agent-connector-for-wp

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Stage plugin files
        # Mirror the plugin/ subtree into a clean, correctly-named plugin
        # directory, excluding development-only files, then add the built
        # vendor/ tree (gitignored, so excluded by the rsync and copied in).
        run: |
          mkdir -p "dist/${PLUGIN_SLUG}"
          rsync -a --delete \
            --exclude='dist' \
            --exclude='vendor' \
            ./ "dist/${PLUGIN_SLUG}/"
          cp -R vendor "dist/${PLUGIN_SLUG}/vendor"

      - name: Create zip
        run: |
          cd dist
          zip -rq "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}
          path: plugin/dist/${{ env.PLUGIN_SLUG }}.zip

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/dist/${{ env.PLUGIN_SLUG }}.zip
