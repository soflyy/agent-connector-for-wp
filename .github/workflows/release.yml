name: Build release zip

# Builds a distributable plugin zip with production Composer dependencies
# vendored in (plugin/vendor is gitignored, so the repo stays lean). Runs on
# version tags, and can be triggered manually for testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_SLUG: agent-connector-for-wp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      # Same two builds as auto-release.yml: the GitHub release asset and the
      # wordpress.org build (see bin/build-plugin-zip.sh).
      - name: Build plugin zips
        run: |
          bin/build-plugin-zip.sh github
          bin/build-plugin-zip.sh org

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}
          path: dist/github/${{ env.PLUGIN_SLUG }}.zip

      - name: Upload wordpress.org build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}-wordpress-org
          path: dist/org/${{ env.PLUGIN_SLUG }}.zip

      # Only the GitHub build is attached, so the GitHub self-updater on
      # existing installs always picks it.
      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/github/${{ env.PLUGIN_SLUG }}.zip
